<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTIUS — Lộ trình Hệ thống &amp; AI cho Phòng Thiết kế</title>
<style>
  :root{
    --bg:#f6f4f1; --surface:#fff; --ink:#1c1a18; --ink-2:#4a453f; --ink-3:#8c857c;
    --line:#e2ddd6; --line-2:#cfc8bf; --brass:#a97b2f; --brass-soft:#f3e9d7;
    --ok:#1a8f7a; --late:#c0453f;
    --r:10px; --sh:0 1px 2px rgba(28,26,24,.06),0 8px 24px rgba(28,26,24,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1632px;margin:0 auto;padding:0 28px 80px}
  header{border-bottom:1px solid var(--line);background:var(--surface)}
  .hd{max-width:1632px;margin:0 auto;padding:24px 28px 20px;display:flex;gap:26px;flex-wrap:wrap;
    align-items:flex-end;justify-content:space-between}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);font-weight:650}
  h1{margin:7px 0 4px;font-size:25px;line-height:1.18;letter-spacing:-.02em;font-weight:680}
  .sub{color:var(--ink-3);font-size:12.5px}
  .live{text-align:right;min-width:230px}
  .livebar{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 6px}
  .livebar i{display:block;height:100%;background:linear-gradient(90deg,#1a8f7a,#2f6fb5);border-radius:99px;transition:width .4s}
  .bignum{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .pulse{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3)}
  .pulse i{width:7px;height:7px;border-radius:99px;background:var(--ink-3)}
  .pulse.on i{background:var(--ok);box-shadow:0 0 0 3px rgba(26,143,122,.16)}
  .pulse+.pulse{margin-top:3px}
  #online{cursor:default}
  #online.on i{background:#2f6fb5;box-shadow:0 0 0 3px rgba(47,111,181,.16)}

  nav{position:sticky;top:0;z-index:40;background:rgba(246,244,241,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .tabs{max-width:1632px;margin:0 auto;padding:0 28px;display:flex;gap:2px;align-items:center}
  .tab{appearance:none;border:0;background:none;padding:13px 14px 10px;font:inherit;font-size:13px;font-weight:560;
    color:var(--ink-3);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--ink);border-color:var(--brass)}
  .menuwrap{position:relative;display:inline-block}
  .menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line-2);
    border-radius:9px;box-shadow:0 10px 28px rgba(28,26,24,.16);padding:5px;display:flex;flex-direction:column;
    min-width:190px;z-index:60}
  .menu[hidden]{display:none}
  .menu button{appearance:none;border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;
    font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
  .menu button:hover{background:#f2efec;color:var(--ink)}
  .toolbar{margin-left:auto;display:flex;gap:7px;padding:7px 0;flex-wrap:wrap;justify-content:flex-end}
  @media (max-width:640px){.tabs{flex-wrap:wrap}.toolbar{margin-left:0;width:100%;justify-content:flex-start}}
  section[hidden]{display:none}

  .panelhead h2{letter-spacing:-.01em}
  .bar-note{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:20px 0 6px;font-size:12px;color:var(--ink-2)}
  .ofl{font-size:12px;color:var(--ink-3);margin-right:2px}
  .ofb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;font:inherit;font-size:12.5px;color:var(--ink-2);cursor:pointer}
  .ofb:hover{border-color:var(--ink-3)}
  .ofb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .ofb .av{width:17px;height:17px;font-size:9.5px}
  .orgwrap{overflow:auto;display:flex;position:relative;max-height:860px;border:1px solid var(--line);border-radius:12px;background:#fbfaf8}
  .orgbar{display:flex;justify-content:flex-end;margin:0 0 8px;min-height:4px}
  .oed{width:100%;box-sizing:border-box;font:inherit;font-weight:650;text-align:inherit;border:1.5px solid #1a8f7a;border-radius:6px;padding:2px 6px;background:#fff;color:var(--ink);outline:none}
  .orgfull{padding:24px 28px 8px}
  .orgcv{position:relative;transform-origin:0 0}
  .orgin{position:absolute;left:0;top:0}
  #orgsz{margin:auto;flex:none}
  .orgzoom{display:flex;gap:6px;align-items:center}
  .orgzoom .btn{min-width:34px}
  .orgzoom .zv{min-width:48px;text-align:center;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .orgsvg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
  .orgsvg .ed{fill:none;stroke:#b9b1a4;stroke-width:1.6;pointer-events:none}
  .orgsvg .eh{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
  .orgsvg .ed.sel{stroke:#c0453f;stroke-width:2.4}
  .orgsvg .eh:hover+.ed,.orgsvg .ed.hv{stroke:#6b645a}
  .orgsvg .xb{pointer-events:all;cursor:pointer}
  .orgsvg .tmp{fill:none;stroke:#1a8f7a;stroke-width:2;stroke-dasharray:5 4}
  .onode{position:absolute;background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;box-shadow:0 1px 2px rgba(28,26,24,.06);
    user-select:none;touch-action:none;cursor:grab;box-sizing:border-box}
  .onode b{display:block;font-size:13px;line-height:1.3;font-weight:650}
  .onode span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px}
  .onode em{display:block;font-size:11px;font-style:italic;color:#8a847b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .onode.or{background:var(--ink);color:#fff;border-color:var(--ink);text-align:center}.onode.or span{color:#d8d2c8}
  .onode.od{border-top:3px solid;text-align:center}
  .onode.ob{border-left:4px solid}
  .onode.ot{padding:8px 10px;border-radius:8px}
  .onode.ot b{font-size:12px;font-weight:600}.onode.ot b i{font-style:normal;color:var(--ink-3);font-weight:700}
  .onode.ot .mini{height:3px;margin-top:6px}
  .onode:hover{box-shadow:0 3px 10px rgba(28,26,24,.12)}
  .onode.drag{z-index:9;cursor:grabbing;box-shadow:0 8px 22px rgba(28,26,24,.26)}
  .onode.target{box-shadow:0 0 0 3px #1a8f7a}
  .oport{position:absolute;left:50%;bottom:-7px;margin-left:-7px;width:14px;height:14px;border-radius:99px;background:#fff;border:2px solid #8c857c;
    opacity:0;cursor:crosshair;transition:opacity .12s}
  .onode:hover .oport,.orgcv.linking .oport{opacity:1}
  .oport:hover{border-color:var(--ink);transform:scale(1.25)}
  .orgcv.linking .onode{cursor:crosshair}
  .myname{font:inherit;font-size:12.5px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;width:130px;margin-right:6px}
    .bar-note .dot{width:9px;height:9px;border-radius:99px;display:inline-block;margin-right:5px;vertical-align:-1px}
  .hint{font-size:12px;color:var(--ink-3);margin:4px 0 16px}

  /* tree */
  .tree{display:flex;flex-direction:column;gap:22px;margin-top:6px}
  .troot{display:flex;gap:18px;align-items:flex-start}
  .tlabel{flex:0 0 150px;padding:12px 14px;border-radius:var(--r);background:var(--ink);color:#fff;font-weight:650;font-size:14px}
  .tlabel small{display:block;font-weight:400;font-size:11px;opacity:.72;margin-top:3px}
  .tbranches{flex:1;display:flex;flex-direction:column;gap:11px;border-left:2px solid var(--line-2);padding-left:20px}
  .tnode{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line-2);border-radius:8px;
    padding:12px 14px;position:relative;box-shadow:var(--sh)}
  .tnode::before{content:"";position:absolute;left:-22px;top:22px;width:20px;height:2px;background:var(--line-2)}
  .tnode h4{margin:0 0 4px;font-size:13.5px;font-weight:650;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .tnode p{margin:0;font-size:12.5px;color:var(--ink-2)}
  .tleaves{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .leaf{font-size:12px;background:#faf8f6;border:1px solid var(--line);border-radius:7px;padding:8px 10px;flex:1 1 200px;
    cursor:pointer;transition:background .12s,border-color .12s}
  .leaf:hover{background:#fff;border-color:var(--line-2)}
  .leaf b{display:block;font-size:12.5px;font-weight:620;margin-bottom:3px}
  .leaf .lmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--ink-3);font-size:11px}
  .mini{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
  .mini i{display:block;height:100%;border-radius:99px}
  .nodeprog{font-size:11px;color:var(--ink-3);font-weight:600;font-variant-numeric:tabular-nums}
  .nodetools{margin-left:auto;display:flex;gap:6px}

  /* gantt */
  .gwrap{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh)}
  .gantt{min-width:1050px}
  .grow{display:grid;grid-template-columns:330px 1fr;border-bottom:1px solid var(--line)}
  .grow:last-child{border-bottom:0}
  .ghead{position:sticky;top:0;z-index:5;background:#faf8f6;border-bottom:1px solid var(--line-2)}
  .gcellL{padding:10px 14px;border-right:1px solid var(--line);min-width:0}
  .months{display:grid;font-size:11px;color:var(--ink-3);font-weight:650;letter-spacing:.04em;text-transform:uppercase}
  .months div{padding:10px 6px;border-left:1px solid var(--line);text-align:center}
  .gtrack{position:relative;min-height:44px;display:flex;align-items:center;padding:8px 0}
  .gstream{background:#f2efec;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);
    padding:8px 14px;grid-column:1/-1;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
  .gstream .sp{margin-left:auto;font-size:11px;letter-spacing:0;text-transform:none;color:var(--ink-3);font-weight:600}
  .bar{position:absolute;height:27px;border-radius:6px;cursor:pointer;display:flex;align-items:center;
    justify-content:center;padding:0 9px;
    font-size:11.5px;font-weight:600;color:#fff;overflow:hidden;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.14);
    transition:transform .12s,filter .12s}
  .bar:hover{transform:translateY(-1px);filter:brightness(1.08)}
  .bar .fill{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.3);pointer-events:none}
  .bar .plan{position:absolute;top:0;bottom:0;width:0;border-left:2px solid rgba(255,255,255,.85);pointer-events:none}
  .bar span{position:relative;z-index:1;text-shadow:0 1px 1px rgba(0,0,0,.25)}
  .bar.late{box-shadow:0 0 0 2px var(--late),0 1px 3px rgba(0,0,0,.14)}
  .bar.done{filter:saturate(.55)}
  .ms{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--brass);pointer-events:none}
  .mslab{position:absolute;top:2px;transform:translateX(-50%);background:var(--brass);color:#fff;font-size:10px;font-weight:700;
    padding:2px 7px;border-radius:99px;white-space:nowrap;z-index:6;cursor:pointer}
  .nowline{position:absolute;top:0;bottom:0;width:0;border-left:2px solid #1c1a18;pointer-events:none;z-index:4}
  .nowlab{position:absolute;bottom:2px;transform:translateX(-50%);background:#1c1a18;color:#fff;font-size:10px;font-weight:700;
    padding:2px 7px;border-radius:99px;white-space:nowrap;z-index:6}
  .grow.rdrag{opacity:.4}
  .grow.rovt .gcellL,.grow.rovt .gtrack{box-shadow:inset 0 2px 0 var(--brass)}
  .grow.rovb .gcellL,.grow.rovb .gtrack{box-shadow:inset 0 -2px 0 var(--brass)}
  .gstream.rovt{box-shadow:inset 0 -2px 0 var(--brass)}
  .rgrip{color:var(--line-2);cursor:grab;margin-right:5px;font-size:13px;letter-spacing:-1px;user-select:none}
  .grow:hover .rgrip{color:var(--ink-3)}
  .gantt{position:relative}
  .gsvg{position:absolute;left:0;top:0;pointer-events:none;z-index:3;overflow:visible}
  .gh{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:4;background:transparent}
  .gh.gl{left:0;border-radius:6px 0 0 6px} .gh.gr{right:0;border-radius:0 6px 6px 0}
  .bar:hover .gh{background:rgba(255,255,255,.45)}
  .bar.grab{cursor:grabbing;filter:brightness(1.1);box-shadow:0 4px 14px rgba(28,26,24,.3)}
  .bardate{position:absolute;top:50%;transform:translateY(-50%);font-size:10.5px;color:var(--ink-3);
    white-space:nowrap;pointer-events:none;z-index:5}
  .bardate.inside{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35);font-weight:600}
  .taskname{font-size:13px;font-weight:580;display:block;margin-bottom:3px}
  .taskmeta{font-size:11.5px;color:var(--ink-3);display:flex;gap:7px;flex-wrap:wrap;align-items:center}

  .chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid var(--line-2);
    background:#fff;white-space:nowrap}
  .chip.sm{font-size:10.5px;padding:1px 7px}
  .chip.ok{color:#146b5c;background:#e6f4f1;border-color:#bde0d8}
  .chip.go{color:#1e5a95;background:#e8f1fa;border-color:#c3dcf2}
  .chip.new{color:#6b6b6b;background:#f2f0ee;border-color:#ddd8d2}
  .chip.hot{color:#9c3a35;background:#fbeceb;border-color:#f0cfcd}
  .chip.warn{color:#8a5512;background:#fdf1e0;border-color:#f0d9b4}
  .owner{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .av{width:19px;height:19px;border-radius:99px;background:var(--brass-soft);color:#7d5a1e;font-size:9px;font-weight:700;
    display:grid;place-items:center;flex:0 0 auto}

  /* drawer */
  .drawer{position:fixed;inset:0 0 0 auto;width:min(580px,96vw);background:var(--surface);border-left:1px solid var(--line-2);
    box-shadow:-14px 0 44px rgba(28,26,24,.16);z-index:90;transform:translateX(102%);transition:transform .22s ease;
    display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .drawer.peek{box-shadow:-10px 0 34px rgba(28,26,24,.13)}
  .dhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
  .dhead h3{margin:5px 0 0;font-size:16.5px;line-height:1.25;font-weight:660}
  .kicker{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:650}
  .dbody{padding:18px 20px 48px;overflow:auto}
  .dbody h5{margin:18px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  .dbody p,.dbody li{font-size:13px;color:var(--ink-2);margin:0;white-space:pre-wrap}
  .dbody ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
  .x{appearance:none;border:1px solid var(--line-2);background:#fff;width:30px;height:30px;border-radius:7px;cursor:pointer;
    font-size:17px;line-height:1;color:var(--ink-2);flex:0 0 auto}
  .drawer:not(.open){box-shadow:none!important}
  .scrim{position:fixed;inset:0;background:rgba(28,26,24,.28);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.on{opacity:1;pointer-events:auto}
  .prog{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px;position:relative}
  .prog i{display:block;height:100%;border-radius:99px}
  .prog u{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dashed var(--ink-3)}

  /* panel nhiệm vụ kiểu Notion */
  .nt{display:flex;flex-direction:column}
  .nt-title{font:inherit;font-size:25px;font-weight:700;letter-spacing:-.02em;color:var(--ink);
    border:0;background:none;padding:2px 0 10px;width:100%;outline:none;line-height:1.25}
  .nt-title::placeholder{color:#c9c2b9}
  .nt-props{display:flex;flex-direction:column;gap:1px;margin-top:4px}
  .pr{display:flex;gap:10px;align-items:flex-start;min-height:34px}
  .pk{flex:0 0 136px;font-size:12.5px;color:var(--ink-3);padding:8px 0 0 2px;font-weight:500}
  .pv{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--ink);border:0;background:none;
    padding:7px 8px;border-radius:6px;outline:none;width:100%}
  input.pv:hover,select.pv:hover{background:#f2efec}
  input.pv:focus,select.pv:focus{background:#fff;box-shadow:0 0 0 2px var(--line-2)}
  .pv.sel{appearance:none;cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238c857c' stroke-width='1.6'/></svg>");
    background-repeat:no-repeat;background-position:right 9px center}
  .pv.ro{padding:7px 8px;color:var(--ink-2)}
  .pv .ph,.ph{color:#b8b1a8}
  .pv.prg{display:flex;gap:9px;align-items:center;padding:4px 8px}
  .pv.prg input[type=range]{flex:1;accent-color:var(--brass);padding:0;background:none}
  .pv.prg input[type=number]{width:58px;text-align:right;font:inherit;font-size:13px;border:0;background:none;
    padding:5px 6px;border-radius:6px;outline:none}
  .pv.prg input[type=number]:hover{background:#f2efec}
  .pv.prg span{font-size:12px;color:var(--ink-3)}
  .pv.dep{padding:5px 8px}
  .depchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .meta2{font-size:12px;color:var(--ink-3);line-height:1.5}
  .lnk{appearance:none;border:0;background:none;font:inherit;font-size:12px;color:var(--brass);
    cursor:pointer;padding:2px 4px;border-radius:5px;font-weight:600}
  .lnk:hover{background:#f3e9d7}
  .lnk.danger{color:var(--late)} .lnk.danger:hover{background:#fbeceb}
  .nt-sec{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
  .nt-h{font-size:12px;font-weight:700;color:var(--ink-2);margin:16px 0 4px;display:flex;gap:8px;align-items:baseline}
  .nt-h:first-child{margin-top:0}
  .nt-h span{font-size:11px;font-weight:400;color:var(--ink-3)}
  .nt-ta{font:inherit;font-size:13px;line-height:1.55;color:var(--ink-2);border:0;background:none;
    width:100%;min-height:52px;padding:7px 8px;border-radius:6px;outline:none;resize:vertical}
  .nt-ta:hover{background:#faf8f6}
  .nt-ta:focus{background:#fff;box-shadow:0 0 0 2px var(--line-2)}
  .nt-ta::placeholder{color:#c9c2b9}
  .nt-ul{margin:4px 0 0;padding-left:20px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
  .nt-foot{margin-top:24px;padding-top:12px;border-top:1px solid var(--line);display:flex;
    justify-content:space-between;align-items:center;gap:12px;font-size:11.5px;color:var(--ink-3)}
  .form{margin-top:16px;background:#faf8f6;border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
  .f{margin-bottom:12px}
  .f label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:650;margin-bottom:5px}
  .f2{display:flex;gap:10px}.f2>*{flex:1}
  input,select,textarea{font:inherit;font-size:13px;padding:8px 9px;border:1px solid var(--line-2);border-radius:7px;
    background:#fff;color:var(--ink);width:100%}
  textarea{min-height:60px;resize:vertical}
  input[type=range]{padding:0;border:0;accent-color:var(--brass);background:none}
  .rangerow{display:flex;gap:9px;align-items:center}
  .rangerow input[type=number]{width:74px;text-align:right;flex:0 0 auto}
  .btn{appearance:none;border:0;border-radius:8px;padding:9px 15px;font:inherit;font-size:12.5px;font-weight:620;cursor:pointer;
    background:var(--ink);color:#fff;white-space:nowrap}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line-2)}
  .btn.danger{background:#fff;color:var(--late);border:1px solid #f0cfcd}
  .btn.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}

let CFG={...DEFCFG}, BR={}, TK={}, GT={};
let OWNF="";
let DB=null, USER=null, RO=false, NAMES={}, READY=false, OPEN=null;
let seedArmed=false, delArmed=null, armTimer=null;
let editOpen=false;

/* ===================== tiện ích ===================== */
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials=n=>String(n).trim().split(/\s+/).map(w=>w[0]||"").join("").slice(0,2).toUpperCase();
const uid=p=>p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const by=(a,b)=>(a.ord??0)-(b.ord??0);
const tkList=()=>Object.values(TK).sort(by);
const realIds=()=>new Set(Object.values(BR).map(b=>b.id));
function brList(){
  const l=Object.values(BR).sort(by), ids=realIds();
  if(Object.values(TK).some(t=>!ids.has(t.branch)))
    l.push({id:"__orphan",root:"KHÁC",title:"Chưa phân nhánh",desc:"Các nhiệm vụ chưa gắn vào nhánh nào — mở từng mục và chọn nhánh cho nó.",color:"#8c857c",ord:9999});
  return l;
}
function tkOf(id){const ids=realIds();
  return tkList().filter(t=>id==="__orphan"?!ids.has(t.branch):t.branch===id);}
const tName=t=>t.name||t.code||t.id;
const UNITS=()=>CFG.months*2;

function dUnit(iso){
  if(!iso) return 0;
  const d=new Date(iso+"T00:00:00"), s=new Date(CFG.start+"T00:00:00");
  if(isNaN(d)||isNaN(s)) return 0;
  const m=(d.getFullYear()-s.getFullYear())*12+(d.getMonth()-s.getMonth());
  const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  return (m+(d.getDate()-1)/dim)*2;
}
const clampU=u=>Math.max(0,Math.min(UNITS(),u));
const isoD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function uToDate(u){                       // nghịch đảo của dUnit
  const s=new Date(CFG.start+"T00:00:00");
  let mf=Math.max(0,u)/2, m=Math.floor(mf), fr=mf-m;
  const d0=new Date(s.getFullYear(),s.getMonth()+m,1);
  const dim=new Date(d0.getFullYear(),d0.getMonth()+1,0).getDate();
  let day=Math.round(fr*dim)+1;
  if(day>dim)return isoD(new Date(d0.getFullYear(),d0.getMonth()+1,1));
  return isoD(new Date(d0.getFullYear(),d0.getMonth(),day));
}
const shortD=iso=>{const d=new Date(iso+"T00:00:00");
  return isNaN(d)?"—":String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");};
const pct=u=>(clampU(u)/UNITS()*100)+"%";
function nowU(){
  const n=new Date(), s=new Date(CFG.start+"T00:00:00");
  const m=(n.getFullYear()-s.getFullYear())*12+(n.getMonth()-s.getMonth());
  const dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();
  return (m+(n.getDate()-1)/dim)*2;
}
function monthLabels(){
  const s=new Date(CFG.start+"T00:00:00"), out=[];
  for(let i=0;i<CFG.months;i++){const d=new Date(s.getFullYear(),s.getMonth()+i,1);
    out.push("T"+(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2));}
  return out;
}
const fmtD=iso=>{if(!iso)return "—";const d=new Date(iso+"T00:00:00");
  return isNaN(d)?"—":d.toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric"});};
const fmtTS=iso=>{if(!iso)return "—";const d=new Date(iso);return isNaN(d)?"—":
  d.toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+
  d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});};

const prog=t=>Math.max(0,Math.min(100,Number(t.progress)||0));
const stat=t=>t.status||(prog(t)>=100?"Hoàn thành":prog(t)>0?"Đang làm":"Chưa bắt đầu");
function planned(t){const a=dUnit(t.start),b=dUnit(t.end),N=nowU();
  if(b<=a)return N>=b?100:0; if(N<=a)return 0; if(N>=b)return 100; return Math.round((N-a)/(b-a)*100);}
const isLate=t=>stat(t)!=="Hoàn thành"&&prog(t)<planned(t)-10;
const chipFor=s=>s==="Hoàn thành"?"ok":s==="Đang làm"?"go":s==="Chậm tiến độ"?"hot":s==="Tạm dừng"?"warn":"new";
const canW=()=>DB&&!RO;

/* ===================== render ===================== */
function renderAll(){calcDup();renderHead();renderTree();renderGantt();renderOrg();renderMatrix();
  renderBOD();renderRecent();renderCompact();renderToolbar();if(OPEN)reopen();}

function renderHead(){
  document.getElementById("ttl").textContent=CFG.title||DEFCFG.title;
  const ml=monthLabels();
  document.getElementById("sub").textContent=
    (ml.length?`Kế hoạch ${ml[0]} – ${ml[ml.length-1]} · `:"")+
    `${brList().length} nhánh · ${tkList().length} nhiệm vụ`+(RO?" · chế độ chỉ đọc":"");
  const ts=tkList(), v=overallPct();
  document.getElementById("ovp").textContent=v+"%";
  document.getElementById("ovp").title="Tính theo trọng số số ngày của từng nhiệm vụ";
  document.getElementById("ovbar").style.width=v+"%";
  const last=ts.map(t=>t.at).filter(Boolean).sort().pop();
  const p=document.getElementById("pulse");
  if(DB){p.classList.add("on");
    document.getElementById("pulsetxt").textContent=last?("Cập nhật gần nhất: "+fmtTS(last)):"Đã kết nối dữ liệu";}
}
function renderTree(){                     // thẻ nhánh: thấy ngay có bao nhiêu việc và là những việc nào
  const el=document.getElementById("branchlist"); if(!el)return;
  const bs=brList();
  const hint=document.getElementById("brhint");
  if(hint)hint.textContent=canW()
    ? "Mỗi thẻ là một mảng công việc kèm danh sách nhiệm vụ bên trong. Nhấp một nhiệm vụ để mở chi tiết."
    : "Mỗi thẻ là một mảng công việc kèm danh sách nhiệm vụ bên trong.";
  if(!bs.length){el.innerHTML=`<div class="empty">${emptyMsg()}</div>`;return;}

  const roots=[]; (CFG.roots||[]).forEach(r=>roots.push(r));
  bs.forEach(b=>{const r=b.root||"KHÁC"; if(!roots.includes(r))roots.push(r);});
  const card=b=>{
    const ts=tkOf(b.id), c=b.color||"#8c857c";
    const avg=ts.length?Math.round(ts.reduce((s,t)=>s+prog(t),0)/ts.length):0;
    const lt=ts.filter(isLate).length;
    const doing=ts.filter(t=>stat(t)==="Đang làm").length;
    const done=ts.filter(t=>stat(t)==="Hoàn thành").length;
    return `<div class="brcard" style="border-left-color:${esc(c)}">
      <div class="brtop">
        <b>${esc(b.title)}</b>
        <span class="brcount">${ts.length} nhiệm vụ</span>
        <span class="brpct" style="color:${ts.length?"var(--ink)":"var(--ink-3)"}">${ts.length?avg+"%":"—"}</span>
      </div>
      <div class="brmeta"><span>${esc(b.root||"—")}</span>
        ${doing?`<span>· ${doing} đang làm</span>`:""}
        ${done?`<span>· ${done} xong</span>`:""}
        ${lt?`<span class="chip sm hot" style="text-transform:none;letter-spacing:0">${lt} chậm</span>`:""}</div>
      <div class="brbar"><i style="width:${avg}%;background:${esc(c)}"></i></div>
      ${b.desc?`<p>${esc(b.desc)}</p>`:""}
      ${ts.length
        ? `<div class="brtasks">`+ts.map(t=>`<div class="brtask" data-tk="${t.id}" title="${esc(tName(t))} — ${stat(t)} — ${prog(t)}%">
             <i class="sq" style="background:${esc(c)}"></i>
             <span class="nm2">${esc(t.code?t.code+" · ":"")}${esc(tName(t))}</span>
             ${warnChips(t)}
             <span class="chip sm ${chipFor(stat(t))}">${stat(t)}</span>
             <span class="pc">${prog(t)}%</span></div>`).join("")+`</div>`
        : `<div class="brempty">Nhánh này chưa có nhiệm vụ nào.</div>`}
      ${canW()?`<div class="bracts">
        <button class="btn ghost sm" data-br="${b.id}">Sửa nhánh</button>
        <button class="btn ghost sm" data-addtk="${b.id}">+ Nhiệm vụ</button></div>`:""}
    </div>`;};
  el.innerHTML=roots.map(r=>{
    const nodes=bs.filter(b=>(b.root||"KHÁC")===r); if(!nodes.length)return "";
    const total=nodes.reduce((n,b)=>n+tkOf(b.id).length,0);
    const late=nodes.reduce((n,b)=>n+tkOf(b.id).filter(isLate).length,0);
    return `<div class="rootrow"><h4>${esc(r)}</h4>
      <span>${nodes.length} nhánh · ${total} nhiệm vụ</span>
      ${late?`<span class="chip sm hot">${late} chậm</span>`:""}</div>
      <div class="brgrid">${nodes.map(card).join("")}</div>`;}).join("");
  bind();
}

/* nhãn ngày: bắt đầu ở mép trái thanh, kết thúc ở mép phải thanh.
   Hết chỗ bên ngoài thì lùi vào trong thanh; thanh quá hẹp thì gộp một nhãn. */
function labelParts(sISO,eISO,a,e){
  const U=UNITS(), sp=a/U*100, ep=Math.max(e,a+U*0.013)/U*100, w=ep-sp;
  const sd=shortD(sISO), ed=shortD(eISO);
  const hide={show:false,txt:"",css:"display:none",inside:false};
  if(w<7){
    const one = ep<80
      ? {show:true,txt:sd+" → "+ed,css:`left:${ep.toFixed(3)}%;margin-left:8px`,inside:false}
      : {show:true,txt:sd+" → "+ed,css:`right:${(100-sp).toFixed(3)}%;margin-right:8px;text-align:right`,inside:false};
    return [hide,one];
  }
  const S = sp>7
    ? {show:true,txt:sd,css:`right:${(100-sp).toFixed(3)}%;margin-right:8px;text-align:right`,inside:false}
    : {show:true,txt:sd,css:`left:${sp.toFixed(3)}%;margin-left:9px`,inside:true};
  const E = ep<88
    ? {show:true,txt:ed,css:`left:${ep.toFixed(3)}%;margin-left:8px`,inside:false}
    : {show:true,txt:ed,css:`right:${(100-ep).toFixed(3)}%;margin-right:9px;text-align:right`,inside:true};
  return [S,E];
}
function labHTML(part,id,which){
  return `<div class="bardate${part.inside?" inside":""}" data-lab-${which}="${id}" style="${part.css}">${part.txt}</div>`;
}
function applyLab(el,part){
  if(!el)return;
  el.className="bardate"+(part.inside?" inside":"");
  el.textContent=part.txt;
  el.style.cssText=part.css+";position:absolute;top:50%;transform:translateY(-50%)";
}
function renderGantt(){
  const bs=brList(), g=document.getElementById("gantt"), ml=monthLabels(), N=nowU(), inR=N>0&&N<UNITS();
  if(!bs.length){g.innerHTML=`<div style="padding:26px">${emptyMsg()}</div>`;return;}
  const gridStyle=`grid-template-columns:repeat(${CFG.months},1fr)`;
  const trackBg=`background:repeating-linear-gradient(to right,transparent 0,transparent calc(100%/${CFG.months} - 1px),var(--line) calc(100%/${CFG.months} - 1px),var(--line) calc(100%/${CFG.months}))`;
  const gates=Object.values(GT).sort((a,b)=>dUnit(a.date)-dUnit(b.date));
  let h=`<div class="grow ghead"><div class="gcellL" style="display:flex;align-items:flex-end;font-size:11px;
    letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:650">Nhiệm vụ · Phụ trách</div>
    <div style="position:relative"><div class="months" style="${gridStyle}">${ml.map(m=>`<div>${m}</div>`).join("")}</div>
    ${gates.map(x=>`<div class="mslab" data-gt="${x.id}" style="left:${pct(dUnit(x.date))}">${esc(x.code||"Mốc")}</div>`).join("")}
    ${inR?`<div class="nowlab" style="left:${pct(N)}">Hôm nay</div>`:""}</div></div>`;
  bs.forEach(b=>{
    const ts=tkOf(b.id).filter(t=>!OWNF||(t.owners||[]).includes(OWNF)); if(!ts.length)return;
    const avg=Math.round(ts.reduce((a,t)=>a+prog(t),0)/ts.length);
    h+=`<div class="grow"><div class="gstream" data-bhead="${b.id}"><i class="dot" style="background:${esc(b.color||"#999")}"></i>${esc(b.title)}
      <span class="sp">${avg}%</span></div></div>`;
    ts.forEach(t=>{
      const a=clampU(dUnit(t.start)), e=clampU(dUnit(t.end));
      const w=Math.max(1.2,(e-a)/UNITS()*100), p=prog(t), st=stat(t), pl=planned(t);
      h+=`<div class="grow" data-row="${t.id}">
        <div class="gcellL" ${canW()?'draggable="true"':''}><span class="taskname">${canW()?`<i class="rgrip">⠿</i>`:""}${esc(t.code?t.code+" · ":"")}${esc(tName(t))}</span>
          <span class="taskmeta"><span class="chip sm ${chipFor(st)}">${st}</span>
          ${(t.owners||[]).map(o=>`<span class="owner"><i class="av">${initials(o)}</i>${esc(o)}</span>`).join("")}
          ${warnChips(t)}</span></div>
        <div class="gtrack" style="${trackBg}">
          ${gates.map(x=>`<div class="ms" style="left:${pct(dUnit(x.date))}"></div>`).join("")}
          ${inR?`<div class="nowline" style="left:${pct(N)}"></div>`:""}
          <div class="bar ${isLate(t)?"late":""} ${st==="Hoàn thành"?"done":""}" data-tk="${t.id}" data-b="${t.id}"
               style="left:${pct(a)};width:${w}%;background:${esc(b.color||"#999")}">
            <div class="fill" style="width:${p}%"></div>
            ${pl>0&&pl<100?`<div class="plan" style="left:${pl}%"></div>`:""}
            <span>${p>0?p+"%":""}</span>
            ${canW()?`<i class="gh gl"></i><i class="gh gr"></i>`:""}</div>
          ${(()=>{const [S,E]=labelParts(t.start,t.end,a,e);
             return labHTML(S,t.id,"s")+labHTML(E,t.id,"e");})()}
          </div></div>`;});
  });
  g.innerHTML=`<svg class="gsvg" id="gsvg"></svg>`+h;
  bindGantt(g);
  drawGanttLinks();
  const owners=[...new Set(Object.values(TK).flatMap(t=>t.owners||[]))].sort((a,b)=>a.localeCompare(b,"vi"));
  if(OWNF&&!owners.includes(OWNF))OWNF="";
  const lg=document.getElementById("legend");
  lg.innerHTML=`<span class="ofl">Phụ trách:</span><button class="ofb ${OWNF?"":"on"}" data-of="">Tất cả</button>`+
    owners.map(o=>`<button class="ofb ${OWNF===o?"on":""}" data-of="${esc(o)}"><i class="av">${initials(o)}</i>${esc(o)}</button>`).join("");
  lg.querySelectorAll("[data-of]").forEach(b=>b.onclick=()=>{OWNF=b.dataset.of;renderGantt();});
  bind();
}

/* đường nối thể hiện quan hệ chặn trên Gantt */
function drawGanttLinks(){
  const g=document.getElementById("gantt"), svg=document.getElementById("gsvg");
  if(!g||!svg)return;
  if(!g.offsetParent&&g.offsetWidth===0){svg.innerHTML="";return;}   // tab đang ẩn
  const gr=g.getBoundingClientRect(), R={};
  g.querySelectorAll("[data-b]").forEach(b=>{const r=b.getBoundingClientRect();
    R[b.dataset.b]={x1:r.left-gr.left,x2:r.right-gr.left,y:r.top-gr.top+r.height/2};});
  let paths="";
  tkList().forEach(t=>depsOf(t).forEach(d=>{
    const A=R[d.id], B=R[t.id]; if(!A||!B)return;
    const gap=14;
    const dd = B.x1>=A.x2+gap
      ? `M${A.x2},${A.y} H${A.x2+gap} V${B.y} H${B.x1-5}`
      : `M${A.x2},${A.y} H${A.x2+gap} V${(A.y+B.y)/2} H${B.x1-gap} V${B.y} H${B.x1-5}`;
    paths+=`<path d="${dd}" fill="none" stroke="#c0453f" stroke-width="1.4" opacity=".5" marker-end="url(#gar)"/>`;
  }));
  svg.setAttribute("width",g.scrollWidth); svg.setAttribute("height",g.scrollHeight);
  svg.innerHTML=`<defs><marker id="gar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5"
    orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0453f"/></marker></defs>`+paths;
}

/* kéo thanh Gantt để đổi ngày */
let gDrag=null;
function bindGantt(g){
  if(!canW())return;
  g.querySelectorAll("[data-b]").forEach(b=>{
    const begin=mode=>ev=>{
      ev.preventDefault();ev.stopPropagation();

             labS:track.querySelector('[data-lab-s="'+t.id+'"]'),

      b.classList.add("grab");

/* kéo dòng trong Timeline để đổi thứ tự / đổi nhánh */
let rowDragId=null;
function bindRowDrag(g){
  if(!canW())return;
  const clear=()=>g.querySelectorAll(".rovt,.rovb").forEach(x=>x.classList.remove("rovt","rovb"));
  g.querySelectorAll("[data-row]").forEach(row=>{
    const cell=row.querySelector(".gcellL"); if(!cell)return;
    cell.ondragstart=e=>{rowDragId=row.dataset.row;row.classList.add("rdrag");
      e.dataTransfer.effectAllowed="move";
      try{e.dataTransfer.setData("text/plain",rowDragId);}catch(err){}};
    cell.ondragend=()=>{row.classList.remove("rdrag");clear();rowDragId=null;};
    row.ondragover=e=>{
      if(!rowDragId||row.dataset.row===rowDragId)return;
      e.preventDefault();e.dataTransfer.dropEffect="move";
      const r=row.getBoundingClientRect(), top=(e.clientY-r.top)<r.height/2;
      clear(); row.classList.add(top?"rovt":"rovb");};
    row.ondragleave=()=>row.classList.remove("rovt","rovb");
    row.ondrop=e=>{
      e.preventDefault(); if(!rowDragId||row.dataset.row===rowDragId)return;
      const r=row.getBoundingClientRect(), above=(e.clientY-r.top)<r.height/2;
      const moved=rowDragId; rowDragId=null; clear();
      const tgt=TK[row.dataset.row]; if(!tgt)return;
      const ids=tkOf(tgt.branch).map(x=>x.id).filter(x=>x!==moved);
      const pos=ids.indexOf(tgt.id);
      const before=above?tgt.id:(ids[pos+1]||null);
      moveRowTo(moved,tgt.branch,before);};
  });
  g.querySelectorAll("[data-bhead]").forEach(hd=>{
    hd.ondragover=e=>{ if(!rowDragId)return; e.preventDefault();e.dataTransfer.dropEffect="move";
      clear(); hd.classList.add("rovt");};
    hd.ondragleave=()=>hd.classList.remove("rovt");
    hd.ondrop=e=>{
      e.preventDefault(); if(!rowDragId)return;
      const moved=rowDragId; rowDragId=null; clear(); hd.classList.remove("rovt");
      const bid=hd.dataset.bhead;
      const first=(tkOf(bid).map(x=>x.id).filter(x=>x!==moved))[0]||null;
      moveRowTo(moved,bid,first);};
  });
}
async function moveRowTo(id,branchId,beforeId){
  const t=TK[id]; if(!t)return;
  const ids=tkOf(branchId).map(x=>x.id).filter(x=>x!==id);
  let at=beforeId?ids.indexOf(beforeId):ids.length;
  if(at<0)at=ids.length;
  ids.splice(at,0,id);
  for(let i=0;i<ids.length;i++){
    const x=TK[ids[i]]; if(!x)continue;
    if(Number(x.ord)===i*10 && x.branch===branchId) continue;
    const rec={...x,ord:i*10,branch:branchId};
    try{await DB.doc("tasks/"+ids[i]).set(rec);TK[ids[i]]=rec;}
    catch(e){RO=true;flash("Không lưu được thứ tự — tài khoản chỉ có quyền xem.");break;}
  }
  renderAll();
}

/* ---- nạp kế hoạch gốc (chạy một lần, giữ nguyên tiến độ đã có) ---- */
async function runSeed(){
  if(!canW())return;
  if(!seedArmed){
    seedArmed=true; clearTimeout(armTimer);
    armTimer=setTimeout(()=>{seedArmed=false;renderToolbar();},8000);
    renderToolbar(); return;

  const pt=document.getElementById("pulsetxt");
  try{
    await DB.doc("meta/config").set(SEED.cfg);
    for(const [id,root,title,desc,color,ord] of SEED.branches){
      await DB.doc("branches/"+id).set({id,root,title,desc,color,ord});
      if(pt)pt.textContent="Đang nạp nhánh "+title+"…";
    }
    for(const [code,date,label] of SEED.gates)
      await DB.doc("gates/"+code).set({id:code,code,date,label});
    let i=0;
    for(const [code,branch,name,owners,start,end,goal,out,dod,dep,ord] of SEED.tasks){
      const old=TK[code]||{};
      const rec={id:code,code,branch,name,owners,start,end,goal,out,dod,dep,ord,
        progress:Number(old.progress)||0,status:old.status||"Chưa bắt đầu",note:old.note||""};
      if(old.at)rec.at=old.at; if(old.by)rec.by=old.by;
      await DB.doc("tasks/"+code).set(rec);
      if(pt)pt.textContent="Đang nạp nhiệm vụ "+(++i)+"/"+SEED.tasks.length+"…";
    }

  }catch(e){
    RO=true;

  if(btn){btn.disabled=false;btn.textContent="Nạp kế hoạch gốc";}
  renderAll();
}


/* ===================== master plan: sơ đồ mạng lưới phụ thuộc ===================== */
let focusId=null;

/* đọc ô "Phụ thuộc" (danh sách mã, ngăn bởi dấu phẩy) thành các nhiệm vụ thật */
function depCodes(t){
  return String(t.dep||"").split(/[,;/|]+/).map(x=>x.trim()).filter(x=>x&&x!=="—"&&x!=="-");
}
function depsOf(t){
  const list=tkList();
  return depCodes(t).map(c=>list.find(x=>(x.code||"").toLowerCase()===c.toLowerCase()))
    .filter(x=>x&&x.id!==t.id);
}
/* mã phụ thuộc trỏ vào nhiệm vụ không còn tồn tại */
function missingDeps(t){
  const list=tkList();
  return depCodes(t).filter(c=>!list.some(x=>(x.code||"").toLowerCase()===c.toLowerCase()));
}
let DUP={};
function calcDup(){
  const m={}; DUP={};
  tkList().forEach(t=>{const c=(t.code||"").trim().toLowerCase(); if(c)m[c]=(m[c]||0)+1;});
  Object.keys(m).forEach(c=>{if(m[c]>1)DUP[c]=m[c];});
}
const isDup=t=>!!DUP[(t.code||"").trim().toLowerCase()];
const outOfRange=t=>dUnit(t.start)<-0.001||dUnit(t.end)>UNITS()+0.001;
function dayCount(a,b){
  const A=new Date(a+"T00:00:00"), B=new Date(b+"T00:00:00");
  if(isNaN(A)||isNaN(B))return 1;
  return Math.max(1,Math.round((B-A)/86400000)+1);
}
/* % tổng tính theo trọng số số ngày, không phải trung bình cộng */
function overallPct(){
  const ts=tkList(); if(!ts.length)return 0;
  let num=0,den=0;
  ts.forEach(t=>{const d=dayCount(t.start,t.end); num+=prog(t)*d; den+=d;});
  return den?Math.round(num/den):0;
}
/* các cảnh báo gắn vào từng nhiệm vụ */
function warnChips(t,skipRange){
  let h="";
  const miss=missingDeps(t);
  if(miss.length)h+=`<span class="chip sm hot" title="Mã phụ thuộc không khớp nhiệm vụ nào">thiếu mã ${esc(miss.join(", "))}</span>`;
  if(isDup(t))h+=`<span class="chip sm hot" title="Có nhiệm vụ khác dùng cùng mã này">trùng mã</span>`;
  if(!skipRange&&outOfRange(t))h+=`<span class="chip sm warn" title="Ngày nằm ngoài khung thời gian đang hiển thị">ngoài khung</span>`;
  return h;
}
/* đợt thực hiện = độ sâu trong chuỗi phụ thuộc (có chặn vòng lặp) */
function waveMap(){
  const memo={},busy={};
  const d=t=>{
    if(memo[t.id]!=null)return memo[t.id];
    if(busy[t.id])return 0;
    busy[t.id]=1;
    const ds=depsOf(t);
    const v=ds.length?Math.min(12,Math.max(...ds.map(d))+1):0;
    busy[t.id]=0; memo[t.id]=v; return v;
  };
  tkList().forEach(d); return memo;
}
/* số việc phía sau phụ thuộc vào nó (gián tiếp tính hết) */
function blockMap(){
  const list=tkList(), fwd={};
  list.forEach(t=>depsOf(t).forEach(d=>{(fwd[d.id]=fwd[d.id]||[]).push(t.id);}));
  const out={};
  list.forEach(t=>{
    const seen=new Set(); const q=[...(fwd[t.id]||[])];
    while(q.length){const id=q.pop(); if(seen.has(id))continue; seen.add(id);
      (fwd[id]||[]).forEach(x=>{if(!seen.has(x))q.push(x);});}
    out[t.id]=seen.size;
  });
  return {blocks:out,fwd};
}
/* chuỗi trước / chuỗi sau của một nhiệm vụ */
function chain(id,fwd){
  const up=new Set(), down=new Set(), byId={}; tkList().forEach(t=>byId[t.id]=t);
  const qu=[id]; while(qu.length){const c=qu.pop();
    depsOf(byId[c]||{}).forEach(d=>{if(!up.has(d.id)){up.add(d.id);qu.push(d.id);}});}
  const qd=[id]; while(qd.length){const c=qd.pop();
    (fwd[c]||[]).forEach(x=>{if(!down.has(x)){down.add(x);qd.push(x);}});}
  return {up,down};
}

const NW=248, NH=68, NGAPX=104, NGAPY=18, PAD=44, SNAP=8;
const HT={};                                   // chiều cao thật của từng ô, đo sau khi vẽ
const hOf=id=>HT[id]||NH;
let POS={}, dragS=null, linkS=null, rewireS=null, unlink=null, WAVE={}, BLK={}, FWD={}, pendXY=null;

/* vị trí tự động theo đợt */
function autoPos(list){
  const maxW=Math.max(0,...list.map(t=>WAVE[t.id]||0));
  const cols=[]; for(let i=0;i<=maxW;i++)cols.push([]);
  list.slice().sort((a,b)=>{
    const ba=BR[a.branch]||{},bb=BR[b.branch]||{};
    return (ba.ord??0)-(bb.ord??0)||((BLK[b.id]||0)-(BLK[a.id]||0))||(a.ord??0)-(b.ord??0);
  }).forEach(t=>cols[WAVE[t.id]||0].push(t));
  const out={};
  cols.forEach((col,ci)=>{let y=0;
    col.forEach(t=>{out[t.id]={x:ci*(NW+NGAPX),y}; y+=hOf(t.id)+NGAPY;});});
  return out;
}
const hasPos=t=>isFinite(Number(t.nx))&&isFinite(Number(t.ny));

function nodeInner(t){
  const b=BR[t.branch]||{}, c=b.color||"#8c857c", st=stat(t);
  return `<span class="wavechip">Đợt ${(WAVE[t.id]||0)+1}</span>
    <b>${esc(t.code?t.code+" · ":"")}${esc(tName(t))}</b>
    <div class="nm"><span class="chip sm ${chipFor(st)}">${st}</span>
      ${warnChips(t,true)}
      ${(t.owners||[]).length?`<span class="nown" title="${esc((t.owners||[]).join(", "))}">${esc((t.owners||[]).join(", "))}</span>`:""}
      <span class="npct">${prog(t)}%</span></div>
    <div class="pbar"><i style="width:${prog(t)}%;background:${esc(c)}"></i></div>
    <button class="chainbtn" data-chain="${t.id}" title="Lọc ra chuỗi việc liên quan">${focusId===t.id?"✕":"⤳"}</button>
    ${canW()?`<div class="port" data-port="${t.id}" title="Kéo từ đây sang ô khác để nối mũi tên"></div>`:""}`;
}
/* cập nhật nhẹ sau mỗi lần tự lưu: chỉ vá đúng ô đang sửa, không vẽ lại cả trang */
function patchTask(id){
  const t=TK[id]; if(!t)return;
  const el=document.querySelector('#netcanvas [data-n="'+id+'"]');
  if(el){
    const b=BR[t.branch]||{};
    el.style.borderLeftColor=b.color||"#8c857c";
    el.classList.toggle("done",stat(t)==="Hoàn thành");
    el.innerHTML=nodeInner(t);
    el.querySelectorAll("[data-chain]").forEach(x=>{
      x.onmousedown=ev=>ev.stopPropagation();
      x.onclick=ev=>{ev.stopPropagation();
        focusId=focusId===x.dataset.chain?null:x.dataset.chain;renderMatrix();};});
    const po=el.querySelector("[data-port]");
    if(po)po.onmousedown=ev=>{ev.preventDefault();ev.stopPropagation();
      linkS={from:po.dataset.port,cur:null};
      const cv=document.getElementById("netcanvas"); if(cv)cv.classList.add("linking");};
  }
  renderHead(); renderBOD(); renderRecent();
}

function renderMatrix(){
  const list=tkList(), canvas=document.getElementById("netcanvas");
  if(!canvas)return;
  WAVE=waveMap(); const bm=blockMap(); BLK=bm.blocks; FWD=bm.fwd;
  renderQuickAdd(); renderBar();
  if(!list.length){canvas.innerHTML="";canvas.style.height="0px";
    const pz=document.getElementById("prio");if(pz)pz.innerHTML="";return;}

  const auto=autoPos(list);
  POS={}; list.forEach(t=>{POS[t.id]=hasPos(t)?{x:+t.nx,y:+t.ny}:(auto[t.id]||{x:0,y:0});});
  const W=Math.max(...list.map(t=>POS[t.id].x))+NW+PAD;
  const H=Math.max(...list.map(t=>POS[t.id].y))+NH+PAD;
  canvas.style.width=W+"px"; canvas.style.height=H+"px";

  const f=focusId&&list.find(t=>t.id===focusId)?focusId:null;
  const rel=f?chain(f,FWD):null;

  canvas.innerHTML=`<svg class="netsvg" id="netsvg" width="${W}" height="${H}"></svg>`
    + list.map(t=>{
      const b=BR[t.branch]||{}, p=POS[t.id], c=b.color||"#8c857c", st=stat(t);
      let cls="";
      if(f){cls = t.id===f?"sel" : rel.up.has(t.id)?"up" : rel.down.has(t.id)?"down" : "dim";}
      return `<div class="nnode ${cls} ${st==="Hoàn thành"?"done":""}" data-n="${t.id}"
        style="left:${p.x}px;top:${p.y}px;border-left-color:${esc(c)}">${nodeInner(t)}</div>`;}).join("");

  // đo chiều cao thật rồi xếp lại các ô chưa được ghim vị trí thủ công
  canvas.querySelectorAll("[data-n]").forEach(e=>{HT[e.dataset.n]=e.offsetHeight;});
  const auto2=autoPos(list);
  list.forEach(t=>{
    if(hasPos(t))return;
    POS[t.id]=auto2[t.id]||POS[t.id];
    const el=canvas.querySelector('[data-n="'+t.id+'"]');
    if(el){el.style.left=POS[t.id].x+"px";el.style.top=POS[t.id].y+"px";}
  });
  canvas.style.width=(Math.max(...list.map(t=>POS[t.id].x))+NW+PAD)+"px";
  canvas.style.height=(Math.max(...list.map(t=>POS[t.id].y+hOf(t.id)))+PAD)+"px";
  const sv=document.getElementById("netsvg");
  if(sv){sv.setAttribute("width",canvas.style.width);sv.setAttribute("height",canvas.style.height);}

  drawEdges();
  bindNet(canvas);
}

/* vẽ lại chỉ phần mũi tên */
function drawEdges(){
  const svg=document.getElementById("netsvg"); if(!svg)return;
  const list=tkList();
  const f=focusId&&list.find(t=>t.id===focusId)?focusId:null;
  const rel=f?chain(f,FWD):null;
  let paths="";
  list.forEach(t=>depsOf(t).forEach(d=>{
    const a=POS[d.id], b=POS[t.id]; if(!a||!b)return;
    const x1=a.x+NW, y1=a.y+hOf(d.id)/2, x2=b.x, y2=b.y+hOf(t.id)/2, mx=(x1+x2)/2;
    const dd=`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2-6},${y2}`;
    let col="cfc8bf", wdt=1.4, op=1;
    if(f){
      const inUp=(rel.up.has(d.id)||d.id===f)&&(rel.up.has(t.id)||t.id===f);
      const inDown=(rel.down.has(t.id)||t.id===f)&&(rel.down.has(d.id)||d.id===f);
      if(inUp){col="2f6fb5";wdt=2.2;} else if(inDown){col="c97a1c";wdt=2.2;} else op=.12;
    }
    const beingMoved=rewireS&&rewireS.from===d.id&&rewireS.to===t.id;
    if(beingMoved)op=.15;
    paths+=`<path class="hit" d="${dd}" data-e="${d.id}|${t.id}"/>`
      +`<path d="${dd}" fill="none" stroke="#${col}" stroke-width="${wdt}" opacity="${op}"
         marker-end="url(#ar${col})" style="pointer-events:none"/>`
      +(canW()?`<circle class="eh ${beingMoved?"off":""}" data-eh="${d.id}|${t.id}"
         cx="${Math.max(x1+6,x2-20)}" cy="${y2}" r="7"><title>Kéo đầu mũi tên sang ô khác để nối lại, thả ra chỗ trống để bỏ liên kết</title></circle>`:"");
  }));
  if(rewireS&&rewireS.cur){
    const a2=POS[rewireS.from];
    if(a2)paths+=`<path d="M${a2.x+NW},${a2.y+hOf(rewireS.from)/2} L${rewireS.cur.x},${rewireS.cur.y}" fill="none"
      stroke="#c0453f" stroke-width="2" stroke-dasharray="5 4" style="pointer-events:none"/>`;
  }
  if(linkS&&linkS.cur){
    const a=POS[linkS.from];
    paths+=`<path d="M${a.x+NW},${a.y+hOf(linkS.from)/2} L${linkS.cur.x},${linkS.cur.y}" fill="none"
      stroke="#1a8f7a" stroke-width="2" stroke-dasharray="5 4" style="pointer-events:none"/>`;
  }
  svg.innerHTML=`<defs>${["cfc8bf","2f6fb5","c97a1c"].map(c=>
      `<marker id="ar${c}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
       <path d="M0,0 L8,4 L0,8 z" fill="#${c}"/></marker>`).join("")}</defs>`+paths;
  svg.querySelectorAll("[data-eh]").forEach(e=>e.onmousedown=ev=>{
    ev.preventDefault();ev.stopPropagation();
    if(!canW())return;
    const [a,b2]=e.dataset.eh.split("|");
    rewireS={from:a,to:b2,cur:null};
    const cv=document.getElementById("netcanvas"); if(cv)cv.classList.add("linking");
    drawEdges();
  });
  svg.querySelectorAll("[data-e]").forEach(e=>e.onclick=ev=>{
    ev.stopPropagation();
    if(!canW())return;
    const [a,b]=e.dataset.e.split("|"); unlink={from:a,to:b}; renderBar();
  });
}

document.addEventListener("mousemove",ev=>{
  if(gDrag){
    const dx=ev.clientX-gDrag.x0;
    if(Math.abs(dx)>3)gDrag.moved=true;
    const du=dx/gDrag.w*UNITS();
    let su=dUnit(gDrag.s), eu=dUnit(gDrag.e);
    const span=eu-su;
    if(gDrag.mode==="move"){
      su=Math.max(0,Math.min(UNITS()-span,su+du)); eu=su+span;
    }else if(gDrag.mode==="start"){
      su=Math.max(0,Math.min(eu-0.12,su+du));
    }else{
      eu=Math.min(UNITS(),Math.max(su+0.12,eu+du));
    }
    gDrag.cur={s:uToDate(su),e:uToDate(eu)};
    const a2=clampU(dUnit(gDrag.cur.s)), b2=clampU(dUnit(gDrag.cur.e));
    gDrag.el.style.left=pct(a2);
    gDrag.el.style.width=Math.max(1.2,(b2-a2)/UNITS()*100)+"%";
    const [S2,E2]=labelParts(gDrag.cur.s,gDrag.cur.e,a2,b2);
    applyLab(gDrag.labS,S2); applyLab(gDrag.labE,E2);
    return;
  }
  const canvas=document.getElementById("netcanvas"); if(!canvas)return;
  if(dragS){
    const dx=ev.clientX-dragS.ox, dy=ev.clientY-dragS.oy;
    if(Math.abs(dx)>4||Math.abs(dy)>4)dragS.moved=true;
    const nx=Math.max(0,Math.round((dragS.sx+dx)/SNAP)*SNAP), ny=Math.max(0,Math.round((dragS.sy+dy)/SNAP)*SNAP);
    POS[dragS.id]={x:nx,y:ny};
    dragS.el.style.left=nx+"px"; dragS.el.style.top=ny+"px";
    drawEdges();
  }else if(linkS||rewireS){
    const st=linkS||rewireS, r=canvas.getBoundingClientRect();
    st.cur={x:ev.clientX-r.left,y:ev.clientY-r.top};
    const over=ev.target.closest?ev.target.closest("[data-n]"):null;
    canvas.querySelectorAll(".nnode").forEach(n=>n.classList.toggle("target",
      !!over&&n===over&&over.dataset.n!==st.from));
    drawEdges();
  }
});

/* nối: "to" phụ thuộc vào "from" */
async function addLink(fromId,toId){
  const from=TK[fromId], to=TK[toId];
  if(!from||!to)return;
  if(!from.code){flash("Nhiệm vụ nguồn chưa có mã nên không nối được. Mở nhiệm vụ và đặt mã trước.");renderMatrix();return;}
  const {up}=chain(fromId,FWD);
  if(up.has(toId)){flash("Không nối được: sẽ tạo vòng lặp phụ thuộc.");renderMatrix();return;}
  const cur=depsOf(to).map(x=>x.code);
  if(cur.some(c=>c.toLowerCase()===from.code.toLowerCase())){renderMatrix();return;}
  const rec={...to,dep:[...cur,from.code].join(", ")};
  try{await DB.doc("tasks/"+toId).set(rec);TK[toId]=rec;}catch(e){RO=true;}
  renderAll();
}
/* kéo đầu mũi tên: nối lại sang ô khác, hoặc thả ra chỗ trống để bỏ hẳn */
async function rewire(fromId,oldToId,newToId){
  if(newToId===oldToId){drawEdges();return;}
  if(newToId===fromId){flash("Không nối được: một nhiệm vụ không thể phụ thuộc chính nó.");renderMatrix();return;}
  if(newToId){
    const {up}=chain(fromId,FWD);
    if(up.has(newToId)){flash("Không nối được: sẽ tạo vòng lặp phụ thuộc. Liên kết cũ được giữ nguyên.");renderMatrix();return;}
  }
  const from=TK[fromId], oldTo=TK[oldToId];
  if(from&&oldTo){
    const rec={...oldTo,dep:depsOf(oldTo).filter(x=>x.id!==fromId).map(x=>x.code).join(", ")};
    try{await DB.doc("tasks/"+oldToId).set(rec);TK[oldToId]=rec;}
    catch(e){RO=true;flash("Không sửa được — tài khoản chỉ có quyền xem.");renderAll();return;}
  }
  if(newToId){ await addLink(fromId,newToId); }
  else { flash("Đã bỏ liên kết."); renderAll(); }
}
async function delLink(fromId,toId){
  const from=TK[fromId], to=TK[toId]; if(!from||!to)return;
  const rec={...to,dep:depsOf(to).filter(x=>x.id!==fromId).map(x=>x.code).join(", ")};
  try{await DB.doc("tasks/"+toId).set(rec);TK[toId]=rec;}catch(e){RO=true;}
  unlink=null; renderAll();
}

function nextCode(branchId){
  const inBr=tkOf(branchId).map(t=>t.code).filter(Boolean);
  const m=inBr.map(c=>(String(c).match(/^[A-Za-z]+/)||[])[0]).filter(Boolean);
  const pre=m.length?m[0]:"T";
  const used=tkList().map(t=>String(t.code||""));
  let n=1; while(used.some(c=>c.toLowerCase()===(pre+n).toLowerCase()))n++;
  return pre+n;
}

function colClusters(list){
  const xs=[...new Set(list.map(t=>Math.round((POS[t.id]||{x:0}).x)))].sort((a,b)=>a-b);
  const cl=[];
  xs.forEach(x=>{ if(!cl.length||x-cl[cl.length-1].max>60)cl.push({min:x,max:x}); else cl[cl.length-1].max=x; });
  return cl;
}
function colIdx(x,cl){
  for(let i=0;i<cl.length;i++) if(x>=cl[i].min-30&&x<=cl[i].max+30) return i;
  for(let i=0;i<cl.length;i++) if(x<cl[i].min) return i;
  return Math.max(0,cl.length-1);
}
function diagramOrder(list){
  const cl=colClusters(list);
  return list.slice().sort((a,b)=>{
    const pa=POS[a.id]||{x:0,y:0}, pb=POS[b.id]||{x:0,y:0};
    return colIdx(pa.x,cl)-colIdx(pb.x,cl) || pa.y-pb.y || pa.x-pb.x;
  });
}

/* kéo dòng trong bảng -> dời ô tương ứng trên sơ đồ */
async function placeInOrder(id,ids){
  const at=ids.indexOf(id); if(at<0)return;
  const prev=at>0?ids[at-1]:null, next=at<ids.length-1?ids[at+1]:null;
  const list=tkList(), cl=colClusters(list);
  let x,y;
  if(prev){ x=POS[prev].x; y=POS[prev].y+hOf(prev)+1; }
  else if(next){ x=POS[next].x; y=Math.max(0,POS[next].y-1); }
  else return;
  POS[id]={x,y};
  const col=colIdx(x,cl);
  const inCol=list.filter(t=>t.id===id||colIdx((POS[t.id]||{x:0}).x,cl)===col);
  inCol.sort((a,b)=>POS[a.id].y-POS[b.id].y);
  let yy=Math.max(0,Math.min(...inCol.map(t=>POS[t.id].y)));
  const ups=[];
  inCol.forEach(t=>{
    const nx=Math.round(x/SNAP)*SNAP, ny=Math.round(yy/SNAP)*SNAP;
    if(+t.nx!==nx||+t.ny!==ny)ups.push({t,nx,ny});
    POS[t.id]={x:nx,y:ny};
    yy+=hOf(t.id)+NGAPY;
  });
  for(const u of ups){
    const rec={...u.t,nx:u.nx,ny:u.ny};
    try{await DB.doc("tasks/"+u.t.id).set(rec);TK[u.t.id]=rec;}
    catch(e){RO=true;flash("Không lưu được thứ tự — tài khoản chỉ có quyền xem.");break;}
  }
  renderAll();
}

function renderPrio(list){
  const ranked=diagramOrder(list);
  const idx={}; ranked.forEach((t,i)=>idx[t.id]=i);

  const bar=document.getElementById("priobar");
  if(bar)bar.innerHTML=`<div class="priobar">
    <span class="chip sm go">Theo sơ đồ</span>
    ${canW()?`<span>Kéo ô trên sơ đồ hoặc kéo dòng ⠿ ở đây — hai bên luôn khớp nhau.</span>`
            :`<span>Thứ tự lấy theo vị trí các ô trên sơ đồ.</span>`}</div>`;

  document.getElementById("prio").innerHTML=
    `<thead><tr>${canW()?`<th style="width:26px"></th>`:""}<th style="width:42px">#</th><th>Nhiệm vụ</th><th>Nhánh</th><th>Đợt</th>
      <th>Chờ việc</th><th class="n">Chặn</th><th class="n">Tiến độ</th></tr></thead><tbody>`+
    ranked.map((t,i)=>{const b=BR[t.branch]||{}, ds=depsOf(t);
      const late=ds.some(d=>idx[d.id]>i);
      return `<tr data-n3="${t.id}" ${canW()?'draggable="true"':''}>
        ${canW()?`<td class="grip">⠿</td>`:""}
        <td><span class="rank">${i+1}</span></td>
        <td><b>${esc(t.code?t.code+" · ":"")}${esc(tName(t))}</b>
          ${late?`<span class="chip sm hot" style="margin-left:6px">xếp trước việc nó chờ</span>`:""}
          ${warnChips(t)}</td>
        <td><span class="chip sm" style="border-color:${esc(b.color||"#ccc")};color:${esc(b.color||"#666")}">${esc(b.title||"—")}</span></td>
        <td>Đợt ${(WAVE[t.id]||0)+1}</td>
        <td style="color:var(--ink-3);font-size:12px">${ds.length?ds.map(d=>esc(d.code||tName(d))).join(", "):"—"}</td>
        <td class="n">${BLK[t.id]||"—"}</td><td class="n">${prog(t)}%</td></tr>`;}).join("")+
    `</tbody>`;

  const rows=Array.from(document.querySelectorAll("#prio tbody tr"));
  rows.forEach(tr=>{
    tr.onclick=()=>{if(rowMoved){rowMoved=false;return;}openTask(tr.dataset.n3);};
    if(!canW())return;
    tr.ondragstart=e=>{dragRow=tr.dataset.n3;rowMoved=false;
      tr.classList.add("dragging");e.dataTransfer.effectAllowed="move";
      try{e.dataTransfer.setData("text/plain",dragRow);}catch(err){}};
    tr.ondragend=()=>{tr.classList.remove("dragging");rows.forEach(r=>r.classList.remove("ovt","ovb"));};
    tr.ondragover=e=>{
      if(!dragRow||tr.dataset.n3===dragRow)return;
      e.preventDefault();e.dataTransfer.dropEffect="move";
      const r=tr.getBoundingClientRect(), top=(e.clientY-r.top)<r.height/2;
      rows.forEach(x=>x.classList.remove("ovt","ovb"));
      tr.classList.add(top?"ovt":"ovb");};
    tr.ondragleave=()=>tr.classList.remove("ovt","ovb");
    tr.ondrop=e=>{
      e.preventDefault(); if(!dragRow||tr.dataset.n3===dragRow)return;
      const r=tr.getBoundingClientRect(), before=(e.clientY-r.top)<r.height/2;
      const ids=ranked.map(x=>x.id).filter(id=>id!==dragRow);
      let at=ids.indexOf(tr.dataset.n3); if(!before)at++;
      ids.splice(at,0,dragRow);
      const moved=dragRow; rowMoved=true; dragRow=null;
      rows.forEach(x=>x.classList.remove("ovt","ovb","dragging"));
      placeInOrder(moved,ids);
    };
  });
}

const VAL=t=>Math.max(0,Math.min(5,Number(t.value)||0));
const EFF=t=>Math.max(0,Math.min(5,Number(t.effort)||0));

/* ===================== drawer ===================== */
function show(modal){
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawer").classList.toggle("peek",modal===false);
  if(modal!==false)document.getElementById("scrim").classList.add("on");
}
function closeD(){
  const wasTask=OPEN&&OPEN.k==="task";
  if(wasTask&&canW()&&document.querySelector("#dbody #t_name")){
    clearTimeout(saveTimer); saveTask();
  }
  OPEN=null;
  document.getElementById("drawer").classList.remove("open","peek");
  document.getElementById("scrim").classList.remove("on");
  if(wasTask)setTimeout(renderAll,80);        // vẽ lại toàn trang sau khi đã đóng
}
document.getElementById("dx").onclick=closeD;
document.getElementById("scrim").onclick=closeD;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeD();});
/* bấm ra vùng trống ngoài panel → tự lưu & đóng; bấm vào phần tử khác (nhiệm vụ, nút…) → chỉ lưu rồi để thao tác đó chạy */
document.addEventListener("mousedown",e=>{
  const dr=document.getElementById("drawer");
  if(!OPEN||!dr.classList.contains("open"))return;
  if(dr.contains(e.target))return;
  if(OPEN.k==="task"&&canW()&&document.querySelector("#dbody #t_name")&&OPEN.dirty){clearTimeout(saveTimer);saveTask();}
  const interactive=e.target.closest("button,a,input,select,textarea,label,[data-n],[data-n3],[data-n4],[data-addtk],tr,.brcard,.gbar,.menu,.tabs,.hd,.toolbar,.port,.chainbtn");
  if(!interactive)closeD();
},true);
function reopen(){ if(!OPEN)return;
  if(OPEN.k==="task"&&OPEN.id&&!TK[OPEN.id]){closeD();return;}
  if(OPEN.k==="branch"&&OPEN.id&&!BR[OPEN.id]){closeD();return;}
  if(OPEN.k==="task"&&OPEN.id&&!OPEN.dirty)openTask(OPEN.id); }

function head(kick,title,color){
  const k=document.getElementById("dk"); k.textContent=kick; k.style.color=color||"var(--ink-3)";
  document.getElementById("dt").textContent=title;
}
function opts(list,sel){return list.map(v=>`<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(v)}</option>`).join("");}

let saveTimer=null, saveState="", fieldFocus=false;

function openTask(id,presetBranch){
  const isNew=!id;
  const t=isNew?{id:uid("t"),branch:presetBranch||(brList().filter(b=>b.id!=="__orphan")[0]||{}).id,
    code:"",name:"",owners:[],start:CFG.start,end:CFG.start,progress:0,status:"Chưa bắt đầu",
    note:"",goal:"",out:[],dod:"",dep:"",
    ord:(tkList().length?Math.max(...tkList().map(x=>x.ord||0)):0)+10}:TK[id];
  if(!t){closeD();return;}
  OPEN={k:"task",id:isNew?null:id,draft:isNew?t:null,dirty:isNew};
  saveState=""; show(false);

  const b=BR[t.branch]||{};
  head(b.title||"Nhiệm vụ","",b.color);
  document.getElementById("dt").textContent="";
  drawTask(t,isNew);
}

function setStatus(msg,err){
  const el=document.getElementById("t_saved"); if(!el)return;
  el.textContent=msg; el.style.color=err?"var(--late)":"var(--ink-3)";
}

async function saveTask(){
  if(!OPEN||OPEN.k!=="task"||!canW())return;
  const q=s=>document.querySelector("#dbody "+s);
  if(!q("#t_name"))return;
  const base=OPEN.id?TK[OPEN.id]:OPEN.draft; if(!base)return;

  const name=q("#t_name").value.trim();
  const code=q("#t_code")?q("#t_code").value.trim():"";
  if(!name){setStatus("Nhập tên để lưu",1);return;}
  if(code&&tkList().some(x=>x.id!==base.id&&(x.code||"").trim().toLowerCase()===code.toLowerCase())){
    setStatus('Mã "'+code+'" đã có nhiệm vụ khác dùng',1);return;}
  const s=q("#t_s")?q("#t_s").value:base.start, e=q("#t_e")?q("#t_e").value:base.end;
  if(s&&e&&e<s){setStatus("Ngày kết thúc sớm hơn ngày bắt đầu",1);return;}

  const rec={...base,name,code,
    branch:q("#t_br")?q("#t_br").value:base.branch,
    dept:q("#t_dept")?(q("#t_dept").value.trim()===defDept(q("#t_br")?q("#t_br").value:base.branch)?"":q("#t_dept").value.trim()):base.dept,
    owners:q("#t_own")?q("#t_own").value.split(",").map(x=>x.trim()).filter(Boolean):base.owners,
    start:s||CFG.start, end:e||s||CFG.start,
    progress:q("#t_nb")?Math.max(0,Math.min(100,+q("#t_nb").value||0)):prog(base),
    status:q("#t_st")?q("#t_st").value:base.status,
    dep:Array.from(document.querySelectorAll("#dbody .t_dep1:checked")).map(x=>x.value).join(", "),
    goal:q("#t_goal")?q("#t_goal").value.trim():base.goal,
    out:q("#t_out")?q("#t_out").value.split("\n").map(x=>x.trim()).filter(Boolean):base.out,
    dod:q("#t_dod")?q("#t_dod").value.trim():base.dod,
    note:q("#t_note")?q("#t_note").value.trim():base.note,
    at:new Date().toISOString()};
  const oid=OPEN.id;                       // giữ lại: panel có thể đóng trong lúc chờ await bên dưới
  if(USER){try{rec.by=await USER.id();}catch(err){}}

  const unchanged=oid&&JSON.stringify({...TK[oid],at:0,by:0})===JSON.stringify({...rec,at:0,by:0});
  if(unchanged){if(OPEN)setStatus("Đã lưu "+fmtTS(TK[oid].at));return;}

  setStatus("Đang lưu…");
  try{
    await DB.doc("tasks/"+rec.id).set(rec);
    TK[rec.id]=rec;
    if(!OPEN||OPEN.k!=="task"){patchTask(rec.id);return;}   // panel đã đóng giữa chừng
    OPEN.id=rec.id; OPEN.draft=null; OPEN.dirty=true;
    setStatus("Đã lưu "+fmtTS(rec.at));
    patchTask(rec.id);
    const hd=document.getElementById("dk"), br=BR[rec.branch]||{};
    if(hd){hd.textContent=br.title||"Nhiệm vụ";hd.style.color=br.color||"var(--ink-3)";}
  }catch(err){RO=true;setStatus("Không lưu được — tài khoản chỉ có quyền xem",1);}
}

    delDoc("branches",id,b,"nhánh này",q("#msg"),q("#del"));};

    loaded[col]=true; notify(col);
  }

  /* ---- tự đồng bộ lại sau khi mất kết nối ----
     Realtime KHÔNG gửi bù các event bị lỡ trong lúc rớt mạng / máy sleep,
     nên phải chủ động nạp lại các collection đã load khi:
       1) channel realtime nối lại được,
       2) người dùng quay lại tab,
       3) máy có mạng trở lại.                                               */
  let syncing=false, lastSync=Date.now(), everSub=false;
  const SYNC_GAP=2000;                       // chặn gọi dồn khi nhiều sự kiện bắn cùng lúc
  async function resyncAll(reason){
    if(syncing||Date.now()-lastSync<SYNC_GAP)return;
    const cols=Object.keys(loaded).filter(c=>loaded[c]);
    if(!cols.length)return;
    syncing=true;
    try{ await Promise.all(cols.map(c=>load(c))); lastSync=Date.now(); }
    catch(e){ console.warn("Đồng bộ lại thất bại ("+reason+")",e); }
    finally{ syncing=false; }
  }
  function onChanStatus(st){
    // lần SUBSCRIBED đầu tiên là lúc mở trang, load() đã chạy rồi nên bỏ qua
    if(st!=="SUBSCRIBED")return;
    if(everSub)resyncAll("realtime reconnect");
    everSub=true;
  }
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible")resyncAll("tab focus");
  });
  window.addEventListener("online",()=>resyncAll("online"));

  sb.channel("docs-live").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
    const r=(p.eventType==="DELETE")?p.old:p.new; if(!r||!r.col)return;
    if(!loaded[r.col])return;
    if(p.eventType==="DELETE"){ if(cache[r.col]&&(r.id in cache[r.col])){delete cache[r.col][r.id];notify(r.col);} return; }
    const cur=cache[r.col][r.id];
    if(cur&&JSON.stringify(cur)===JSON.stringify(p.new.data))return;       // tiếng vọng của chính mình
    cache[r.col][r.id]=p.new.data; notify(r.col);
  }).subscribe(onChanStatus);
  const parse=path=>{const i=path.indexOf("/");return [path.slice(0,i),path.slice(i+1)];};
  return {
    collection(col){return {onSnapshot(cb,err){
      (subs[col]=subs[col]||[]).push(cb);
      if(loaded[col])cb(snap(col)); else load(col).catch(e=>{if(err)err(e);});
      return ()=>{subs[col]=(subs[col]||[]).filter(f=>f!==cb);};}};},
    doc(path){const [col,id]=parse(path);return {
      async set(rec){
        const {error}=await sb.from("docs").upsert({col,id,data:rec,updated_at:new Date().toISOString()});
        if(error)throw error;
        (cache[col]=cache[col]||{})[id]=JSON.parse(JSON.stringify(rec));},
      async delete(){
        const {error}=await sb.from("docs").delete().eq("col",col).eq("id",id);
        if(error)throw error;
        if(cache[col])delete cache[col][id];}};}
  };
}
async function SB_INIT(){
  if(!window.supabase||SB_URL.indexOf("__")===0)throw new Error("Chưa cấu hình Supabase");
  SB=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  DB=SB_SHIM(SB); RO=false;
  USER={
    async id(){return myName()||"Khách";},
    async profiles(ids){const o={};ids.forEach(i=>o[i]={name:LEGACY_NAMES[i]||i});return o;},
    can(){return true;}};
}
function myName(){try{return (localStorage.getItem("artius_name")||"").trim();}catch(e){return "";}}
/* ===================== ai đang mở trang (Realtime Presence) =====================
   Presence của Supabase giữ trạng thái trong bộ nhớ của realtime server, không
   ghi vào database -> không cần bảng, không đụng RLS, tự dọn khi người dùng
   đóng tab hoặc rớt mạng.                                                      */
let PRES=null;
const CLIENT_ID=(()=>{                      // mỗi TAB một id riêng
  try{ let k=sessionStorage.getItem("artius_cid");
       if(!k){k="c_"+Math.random().toString(36).slice(2,10);sessionStorage.setItem("artius_cid",k);}
       return k; }
  catch(e){ return "c_"+Math.random().toString(36).slice(2,10); }
})();

function renderOnline(){
  const box=document.getElementById("online"), el=document.getElementById("onltxt");
  if(!box||!el)return;
  if(!PRES){box.hidden=true;return;}
  const st=PRES.presenceState()||{};
  const names=Object.values(st).map(a=>((a&&a[0])||{}).name||"Khách");
  if(!names.length){box.hidden=true;return;}
  // gộp các tab của cùng một người theo tên; người chưa đặt tên thì đếm riêng
  const named=[...new Set(names.filter(n=>n!=="Khách"))];
  const guests=names.filter(n=>n==="Khách").length;
  const n=named.length+guests;
  box.hidden=false; box.classList.add("on");
  el.textContent=n+" người đang mở trang";
  const parts=[]; if(named.length)parts.push(named.join(", "));
  if(guests)parts.push(guests+" người chưa đặt tên");
  box.title=parts.join(" · ");
}
function presPayload(){return {name:myName()||"Khách",at:new Date().toISOString()};}
function presenceInit(){
  if(!SB)return;
  PRES=SB.channel("presence-roadmap",{config:{presence:{key:CLIENT_ID}}});
  PRES.on("presence",{event:"sync"},renderOnline)
      .on("presence",{event:"join"},renderOnline)
      .on("presence",{event:"leave"},renderOnline)
      .subscribe(st=>{ if(st==="SUBSCRIBED")PRES.track(presPayload()).catch(()=>{}); });
}
function presenceRename(){                  // gọi khi người dùng đổi ô "Tên của bạn"
  if(PRES)PRES.track(presPayload()).catch(()=>{});
}

function authHTML(){
  return `<input id="myname" class="myname" placeholder="Tên của bạn" maxlength="30" value="${esc(myName())}" title="Tên hiện ở mục cập nhật khi bạn sửa">`;
}
function bindAuth(tb){
  const i=tb.querySelector("#myname"); if(!i)return;
  i.onchange=()=>{try{localStorage.setItem("artius_name",i.value.trim());}catch(e){}presenceRename();};
}

/* ===================== tabs ===================== */
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b?"true":"false"));
  ["p2","p3"].forEach(id=>{document.getElementById(id).hidden=(id!==b.dataset.p);});
  document.getElementById("p3top").hidden=(b.dataset.p!=="p3");
  if(b.dataset.p==="p2")setTimeout(drawGanttLinks,60);
  window.scrollTo({top:0,behavior:"smooth"});
}));

/* ===================== khởi tạo ===================== */
renderAll();
let timer=setTimeout(()=>{if(!READY)document.getElementById("pulsetxt").textContent=
  "Không kết nối được dữ liệu — hãy tải lại trang";},10000);

(async()=>{
  try{await SB_INIT();}catch(e){console.error(e);}
  if(!DB){clearTimeout(timer);
    document.getElementById("pulsetxt").textContent="Chưa cấu hình kết nối Supabase (xem HUONG-DAN.md)";return;}
  const rows=snap=>{const o={};(snap&&snap.docs?snap.docs:snap||[]).forEach(d=>{
    const k=String(d.id||"").split("/").pop(); const v=(typeof d.data==="function"?d.data():d.data)||{};
    if(k){v.id=v.id||k;o[k]=v;}});return o;};
  const done=()=>{READY=true;clearTimeout(timer);resolveNames().then(()=>{
    if(OPEN&&OPEN.k==="task"&&OPEN.dirty&&document.querySelector("#dbody #t_name")){renderHead();renderBOD();renderRecent();}  // đang gõ: không vẽ lại cả trang
    else renderAll();});};
  try{
    DB.collection("branches").onSnapshot(s=>{BR=rows(s);done();},()=>{});
    DB.collection("tasks").onSnapshot(s=>{TK=rows(s);done();},()=>{});
    DB.collection("gates").onSnapshot(s=>{GT=rows(s);done();},()=>{});
    DB.collection("meta").onSnapshot(s=>{const m=rows(s);if(m.config)CFG={...DEFCFG,...m.config};if(m.org)ORG={pos:m.org.pos||[],add:m.org.add||[],del:m.org.del||[]};done();},()=>{});
  }catch(e){clearTimeout(timer);}
  try{presenceInit();}catch(e){console.warn("Presence lỗi",e);}
  renderToolbar();
})();

async function resolveNames(){
  if(!USER||!USER.profiles)return;
  const ids=[...new Set(tkList().map(t=>t.by).filter(Boolean))];
  if(!ids.length)return;
  try{const ps=await USER.profiles(ids);ids.forEach(i=>{NAMES[i]=(ps[i]&&ps[i].name)||"người phụ trách";});}catch(e){}
}
</script>
